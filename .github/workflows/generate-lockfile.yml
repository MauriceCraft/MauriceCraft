name: Generate npm lockfile (temporary)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Generate exact npm dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile (once)
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already versioned; no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): commit resolved npm dependency lockfile"
          git push origin HEAD:main
